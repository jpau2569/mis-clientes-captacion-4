<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1322">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Captación 4">
<title>Mis Clientes y Captación 4</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f5fbf'/%3E%3Cpath d='M16 46V22l16-10 16 10v24H38V32H26v14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: herramienta de despacho, sobria y rápida; el papel es el protagonista.
   IDEA: la carpeta de captación de la agencia: hoja de encargo A4 real, con líneas para escribir a mano.
   PICTURE: la propia hoja A4 y el embudo de captación del panel.
   COLOUR and TYPE: azul noche + acero + azul eléctrico y oro del logo PICP; Sora titulares, Inter texto.
   LAYOUT: barra superior en PC, barra inferior con botón central en móvil; formulario en una columna con resumen fijo al lado. */
:root{color-scheme:light dark;--bg:light-dark(#f1f4f9,#0a0f19);--sf:light-dark(#ffffff,#111a28);--sf2:light-dark(#f5f8fc,#182132);--ink:light-dark(#1a1c20,#ecebe8);--mut:light-dark(#5a6475,#98a4b8);--line:light-dark(#dce3ee,#26324a);--acc:#1f5fbf;--acc2:light-dark(#174a99,#7fb1f5);--accbg:light-dark(#e4eefc,#16263f);--ok:light-dark(#2e7a4e,#62c28b);--okbg:light-dark(#e5f3ea,#173324);--warn:light-dark(#9a5a12,#e3a556);--warnbg:light-dark(#fbf0df,#3a2b14);--gr:#0c1322;--sh:0 1px 2px rgba(0,0,0,.06),0 6px 24px rgba(0,0,0,.06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Sora,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:30;background:var(--gr);color:#f1efec;padding:0 max(3vw,14px);padding-top:env(safe-area-inset-top)}
.topin{max-width:1240px;margin:auto;display:flex;align-items:center;gap:18px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:Sora;font-weight:600;font-size:16px;white-space:nowrap}
.brand .lg{width:32px;height:32px;border-radius:9px;background:var(--acc);display:grid;place-items:center}
.brand small{display:block;font:500 11px Inter;color:#b9b5ae}
.tabs{display:flex;gap:4px;margin-left:12px}
.tabs button{background:none;border:0;color:#c9c5bf;padding:9px 14px;border-radius:9px;font-weight:500;display:flex;gap:8px;align-items:center;min-height:42px}
.tabs button.on{background:#ffffff16;color:#fff}
.sp{flex:1}
.sync{font-size:12.5px;color:#c9c5bf;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#888}
.sync.cloud i{background:#5fc28b}.sync.sync i{background:#e3a556}.sync.offline i{background:#e06a52}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--sf);font-weight:600;font-size:15px;white-space:nowrap}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.g{background:transparent}
.btn.d{color:#c0392b}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ib{width:44px;height:44px;border-radius:11px;border:1px solid transparent;background:none;display:grid;place-items:center}
main{max-width:1240px;margin:auto;padding:22px max(3vw,14px) 110px}
.band{background:var(--gr);color:#f1efec;margin:0 0 22px;border-radius:20px;padding:26px clamp(16px,3vw,32px) 26px}
.bandin{max-width:1240px;margin:auto}
.hello{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.hello h1{font-size:clamp(26px,3.4vw,38px);font-weight:600}
.hello p{margin:6px 0 0;color:#b9b5ae}
.hello .acts{display:flex;gap:10px;flex-wrap:wrap}
.hello .btn:not(.p){background:#ffffff10;border-color:#ffffff24;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:#ffffff1c;border-radius:14px;overflow:hidden;margin-top:24px}
.kpi{background:#16213a;padding:16px 18px}
.kpi b{display:block;font:600 clamp(24px,3vw,32px)/1.1 Sora;color:#fff;white-space:nowrap}
.kpi span{font-size:13px;color:#b9b5ae}
.kpi.a b{color:#f2c46b}
.funnel{margin-top:16px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.st{background:#ffffff0d;border:0;border-radius:11px;padding:10px 12px;text-align:left;color:#ddd;min-height:64px}
.st b{display:block;font:600 22px Sora;color:#fff}
.st span{font-size:12.5px;line-height:1.25;display:block}
.st .bar{height:4px;border-radius:3px;background:#ffffff1a;margin-top:8px;overflow:hidden}.st .bar i{display:block;height:100%;background:var(--acc)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.card h2{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.row:first-of-type{border-top:0}
.row:hover{background:var(--sf2)}
.row .t{flex:1}
.row .t b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t span{font-size:13px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;font-size:13px;color:var(--mut);white-space:nowrap}
.row .r b{display:block;color:var(--ink);font-size:15px}
.av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:600 14px Sora;background:var(--accbg);color:var(--acc2);flex:none}
.av.v{background:var(--okbg);color:var(--ok)}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sf2);border:1px solid var(--line);white-space:nowrap;color:var(--mut)}
.tag.a{background:var(--accbg);border-color:transparent;color:var(--acc2)}
.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.tag.w{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:15px}
.bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar2 h1{font-size:clamp(24px,3vw,32px);font-weight:600;margin-right:auto}
.search{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--line);border-radius:11px;padding:0 12px;min-height:44px;flex:1 1 260px;max-width:420px}
.search input{border:0;background:none;outline:0;flex:1;font-size:16px;min-height:42px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:0 14px;min-height:38px;font-size:14px;font-weight:500;color:var(--mut)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:10px}
.item{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer}
.item:hover{border-color:var(--acc)}
.item .t b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:13.5px;color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item .r{text-align:right;white-space:nowrap}
.item .r b{display:block;font:600 16px Sora}
.item .r span{font-size:12.5px;color:var(--mut)}
/* editor */
.ebar{position:sticky;top:60px;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;margin-top:-10px;flex-wrap:wrap}
.ebar .tt{margin-right:auto}
.ebar .tt b{display:block;font:600 18px Sora}
.ebar .tt span{font-size:13px;color:var(--mut)}
.seg{display:inline-flex;background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:0 14px;min-height:38px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:7px}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.save{font-size:12.5px;color:var(--mut);white-space:nowrap}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.side{position:sticky;top:136px;display:grid;gap:14px;max-height:calc(100vh - 150px);overflow:auto;overscroll-behavior:contain;padding-bottom:4px}
.sec{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px 18px 8px;margin-bottom:14px}
.sec>h3{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec>h3 em{font:600 12px Inter;font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--accbg);color:var(--acc2);display:grid;place-items:center}
.fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 12px;margin-bottom:10px}
.fl{display:flex;flex-direction:column;gap:5px;grid-column:span 2}
.fl.h{grid-column:span 1}
.fl>span{font-size:13px;font-weight:500;color:var(--mut)}
.fl .req{color:var(--acc);margin-left:2px}
.fl small{font-size:12px;color:var(--warn)}
input[type=text],input[type=date],input[type=time],input[type=email],input[type=tel],select,textarea{width:100%;min-height:48px;border:1px solid var(--line);background:var(--sf2);border-radius:11px;padding:10px 12px;font-size:16px;outline:0}
textarea{resize:vertical;min-height:90px;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--acc);background:var(--sf)}
.ck{display:flex;align-items:flex-start;gap:11px;padding:9px 0;font-size:15px;cursor:pointer;grid-column:span 2}
.ck input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin:1px 0 0}
.tit{border:1px dashed var(--line);border-radius:13px;padding:14px;margin-bottom:12px}
.tit .th{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-weight:600}
.hon{background:var(--gr);color:#f1efec;border-radius:16px;padding:18px}
.hon small{color:#b9b5ae;font-size:13px}
.hon .big{font:600 30px/1.1 Sora;margin:6px 0 10px;white-space:nowrap}
.hon table{width:100%;border-collapse:collapse;font-size:14px}
.hon td{padding:3px 0}.hon td:last-child{text-align:right;white-space:nowrap}
.pend li{font-size:14px;margin:4px 0;color:var(--warn)}
.pend ul{margin:0;padding-left:18px}
.okline{color:var(--ok);font-weight:600;font-size:14.5px}
.sg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.sg:first-of-type{border-top:0}
.sg .n{flex:1;font-size:14.5px}
.sg img{height:34px;max-width:90px;object-fit:contain;background:#fff;border-radius:6px}
.tip{font-size:13.5px;color:var(--mut);background:var(--sf2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
/* hoja */
.sheet{position:relative;margin:0 calc(-1*max(3vw,14px));background:light-dark(#cdd5e1,#060a11);min-height:calc(100vh - 140px)}
.sheetsc{overflow:auto;height:calc(100vh - 136px);height:calc(100dvh - 136px);padding:18px 12px 120px;overscroll-behavior:contain}
.pw{margin:0 auto 18px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.page{width:794px;height:1123px;background:#fff;color:#1b1b1b;position:relative;overflow:hidden;transform-origin:0 0;padding:44px 50px 40px;font:10.4px/1.42 Inter,sans-serif;color-scheme:light}
.ink{position:absolute;inset:0;width:794px;height:1123px;z-index:5;pointer-events:none;touch-action:auto}
.inkon .ink{pointer-events:auto;touch-action:none;cursor:crosshair}
.ph{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #1f5fbf;padding-bottom:12px}
.pa{font:600 19px Sora;color:#1e2024}
.ps{font-size:10px;color:#1f5fbf;font-weight:600;margin:1px 0 4px}
.pc{font-size:9.2px;color:#555}
.pf{text-align:right;min-width:150px;font-size:10px}
.pfl{font-size:8.4px;color:#777;margin-top:2px}
.pfn{font:600 15px Sora;color:#1e2024}
.pt{font:600 17px Sora;margin:14px 0 2px;color:#1e2024}
.pst{color:#555;font-size:10.4px;margin-bottom:8px}
.ps2{font:600 11px Sora;color:#1f5fbf;margin:12px 0 5px;padding-bottom:3px;border-bottom:1px solid #cfdcf0}
.pg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px 12px}
.fb{grid-column:span 2}
.fb i{display:block;font-style:normal;font-size:8.2px;color:#777;line-height:1.2}
.fb b{display:block;font-weight:500;font-size:10.6px;min-height:18px;border-bottom:1px solid #aab4c2;padding:1px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb b.e{border-bottom:1px dotted #8e99a8}
.cb span{white-space:nowrap}.cbx .cb span{white-space:normal}
.tb{border:1px solid #dbe3ee;border-radius:6px;padding:6px 8px;margin-bottom:6px}
.tb .tn{font:600 9px Sora;color:#1f5fbf;margin-bottom:2px}
.cbx{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px}
.cbx.c3{grid-template-columns:1fr 1fr 1fr}
.cb{display:flex;gap:6px;align-items:flex-start;font-size:9.8px}
.cb i{width:10px;height:10px;border:1px solid #555;border-radius:2px;flex:none;margin-top:1px;position:relative}
.cb i.on::after{content:"";position:absolute;left:2.5px;top:0;width:3px;height:6px;border:solid #1e2024;border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.money{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:stretch}
.mbox{border:1px solid #dbe3ee;border-radius:6px;padding:8px 10px}
.mbox .mv{font:600 17px Sora;color:#1e2024;min-height:22px;border-bottom:1px dotted #8e99a8}
.mbox .mv.f{border:0}
.mtab{width:100%;border-collapse:collapse;font-size:10px}
.mtab td{padding:1px 0}.mtab td:last-child{text-align:right;font-weight:600}
.cl{margin:0;padding-left:15px;font-size:9.6px;line-height:1.46;text-align:justify}
.cl li{margin-bottom:4px}
.lines{background:repeating-linear-gradient(#fff 0 21px,#c5cdd8 21px 22px);border:1px solid #dbe3ee;border-radius:6px;padding:2px 8px;line-height:22px;font-size:10.6px;white-space:pre-wrap}
.grid5{background-color:#fff;background-image:linear-gradient(#e6ebf2 1px,transparent 1px),linear-gradient(90deg,#e6ebf2 1px,transparent 1px);background-size:20px 20px;border:1px solid #d5dde8;border-radius:6px}
.firmas{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px;margin-top:8px}
.fbx{border:1px solid #c3ccd9;border-radius:6px;height:104px;position:relative;padding:5px 8px}
.fbx i{font-style:normal;font-size:8.4px;color:#777;display:block}
.fbx b{position:absolute;left:8px;right:8px;bottom:5px;font-size:9.2px;font-weight:600;border-top:1px solid #c3ccd9;padding-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbx img{position:absolute;left:8px;right:8px;top:14px;height:66px;width:calc(100% - 16px);object-fit:contain}
.rub{position:absolute;left:50px;right:50px;bottom:40px;display:flex;gap:10px;align-items:flex-end;font-size:8.4px;color:#777}.rub div{flex:1;height:44px;border:1px dashed #c3ccd9;border-radius:5px;padding:3px 6px}
.pfoot{position:absolute;left:50px;right:50px;bottom:18px;display:flex;justify-content:space-between;font-size:8.2px;color:#999}
.tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;background:var(--gr);color:#eee;border-radius:16px;padding:6px;display:flex;align-items:center;gap:2px;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.tools>*{flex:none}.tools .ib{color:#ddd;width:42px;height:42px}
.tools .ib.on{background:#ffffff1f;color:#fff}
.tools .sep{width:1px;height:26px;background:#ffffff22;margin:0 4px;flex:none}
.tools .dot{width:42px;height:42px;border:0;background:none;display:grid;place-items:center;flex:none}
.tools .dot i{width:20px;height:20px;border-radius:50%;border:2px solid #ffffff40}
.tools .dot.on i{border-color:#fff;box-shadow:0 0 0 2px var(--gr),0 0 0 4px #fff}
.tools .mode{display:flex;gap:7px;align-items:center;border:0;border-radius:11px;padding:0 13px;min-height:42px;font-weight:600;background:#ffffff14;color:#fff;flex:none;font-size:14px}
.tools .mode.on{background:var(--acc)}
.tools .tg{font-size:12.5px;padding:0 10px;min-height:42px;border:0;background:none;color:#ccc;border-radius:11px;flex:none;font-weight:600}
.tools .tg.on{color:#fff;background:#ffffff1f}
.tools .sz{font-size:12px;color:#ddd;width:36px;height:42px;border:0;background:none;border-radius:10px;flex:none;display:grid;place-items:center}
.tools .sz.on{background:#ffffff1f}
.tools .sz i{display:block;border-radius:50%;background:currentColor}
/* modal */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,10,12,.55);display:grid;place-items:center;padding:16px;animation:fd .15s ease}
@keyframes fd{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov{animation:none}}
.md{background:var(--sf);border-radius:18px;width:min(640px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.md h2{font-size:20px;font-weight:600;margin-bottom:6px}
.md p{color:var(--mut);margin:0 0 14px}
.mdf{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.pad{width:100%;aspect-ratio:3/1.15;background:#fff;border-radius:12px;border:1px solid var(--line);touch-action:none;display:block;cursor:crosshair}
.padln{position:relative}
.padln::after{content:"";position:absolute;left:8%;right:8%;bottom:24%;border-bottom:1px dashed #bbb;pointer-events:none}
.sheetm{display:grid;gap:8px}
.sheetm button{justify-content:flex-start;min-height:56px;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14.5px;z-index:80;box-shadow:var(--sh);max-width:calc(100vw - 32px)}
.bnav{display:none}
.seglog{display:grid;gap:8px;margin-top:8px}
.seglog div{background:var(--sf2);border-radius:10px;padding:8px 11px;font-size:14px}
.seglog small{color:var(--mut);display:block;font-size:12px}
#off{position:fixed;left:-20000px;top:0;width:794px}
@media(max-width:1020px){.ed{grid-template-columns:minmax(0,1fr)}.side{position:static;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-height:none;overflow:visible}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.funnel{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){

 const off=$('#off');const ps=alt?alt.pages:pagesOf(d);off.innerHTML=ps.map(h=>`<div class="page">${h}</div>`).join('');try{await document.fonts.ready}catch(_){}
 const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',compress:true});const els=$$('.page',off);
 for(let i=0;i<els.length;i++){const can=await html2canvas(els[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true,width:PW,height:PH,windowWidth:PW});const L=alt?[]:inkOf(`i:${d.id}:${i}`);if(L.length){const c=can.getContext('2d');const r=can.width/PW;c.setTransform(r,0,0,r,0,0);L.forEach(s=>drawStroke(c,s))}
  if(i)pdf.addPage();pdf.addImage(can.toDataURL('image/jpeg',.9),'JPEG',0,0,210,297)}
 off.innerHTML='';const name=`${d.folio}_${(people(d)[0]?.n||'cliente').replace(/[^\wáéíóúñÁÉÍÓÚÑ ]/g,'').trim().replace(/\s+/g,'-')}.pdf`;const blob=pdf.output('blob');return{name:alt?alt.name:name,blob}}
async function makePDF(){const r=await buildPDF();if(r)await saveFile(r.name,r.blob,'PDF')}
async function saveFile(name,data,what){let dl=null;try{dl=typeof window.claude?.use==='function'?await claude.use('downloads'):null}catch(_){}
 if(dl){try{await dl.save({filename:name,data});toast(what+' guardado')}catch(e){toast(e?.code==='declined'?'Descarga cancelada':e?.code==='host_unavailable'?'Este dispositivo no puede guardar archivos aquí: ábrelo en el navegador':'No se pudo guardar el archivo')}return}
 if(window.self!==window.top){toast('Descarga no disponible en esta vista');return}
 const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(what+' descargado')}
function doPrint(){const d=S.cur;saveNow();const ps=pagesOf(d);const prt=$('#prt');prt.innerHTML=ps.map((h,i)=>{const L=inkOf(`i:${d.id}:${i}`);let img='';if(L.length){const cv=document.createElement('canvas');cv.width=PW*2;cv.height=PH*2;drawAll(cv,L);img=`<img class="inkimg" src="${cv.toDataURL()}" alt="">`}return `<div class="page">${h}${img}</div>`}).join('');setTimeout(()=>{try{window.print()}catch(_){}},60)}
